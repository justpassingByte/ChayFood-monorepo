services:
  nginx:
    image: nginx:alpine
    container_name: chayfood-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - chayfood-network

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: chayfood-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api
    networks:
      - chayfood-network

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: chayfood-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://chayfood:chayfood_secret@postgres:5432/chayfood_db?schema=public
      - JWT_SECRET=production_super_secret_chayfood_jwt_token_2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chayfood-network

  postgres:
    image: postgres:16-alpine
    container_name: chayfood-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: chayfood
      POSTGRES_PASSWORD: chayfood_secret
      POSTGRES_DB: chayfood_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chayfood -d chayfood_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chayfood-network

networks:
  chayfood-network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
